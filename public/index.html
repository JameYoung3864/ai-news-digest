<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI News Digest · AI 新闻聚合与智能总结</title>
    <meta name="description" content="聚合全球 AI 新闻，一键用 DeepSeek 生成摘要、要点与关键词。密钥全部由后端代理，前端零泄露。" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      // 提前应用主题，避免首屏闪烁
      try {
        var saved = JSON.parse(localStorage.getItem('ainews.settings') || '{}');
        var theme = saved.theme;
        if (!theme || theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div class="progress" id="progress" aria-hidden="true"></div>

    <header class="site-header" id="site-header"></header>

    <main class="view" id="view" tabindex="-1"></main>

    <footer class="site-footer" id="site-footer"></footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
    <noscript>
      <p style="padding: 2rem; text-align: center">本站需要启用 JavaScript 才能运行。</p>
    </noscript>
  </body>
</html>
